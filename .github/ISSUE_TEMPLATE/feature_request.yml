name: Feature idea
description: Suggest something Aurelo should do
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Aurelo to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it help you with? Screenshots or examples are welcome.
